<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bobtention Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.6;background:#0d1117;color:#e6edf3;min-height:100vh}
a{color:#58a6ff;text-decoration:none}

/* ── Layout ─────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* ── Sidebar ─────────────────────────────────────────────────────── */
.sidebar{background:#161b22;border-right:1px solid #30363d;padding:0;display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:14px 16px;border-bottom:1px solid #30363d;font-weight:700;font-size:13px;letter-spacing:.04em;color:#8b949e;text-transform:uppercase}
.sidebar-sessions{flex:1;overflow-y:auto}
.session-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid #21262d;transition:background .1s}
.session-item:hover{background:#1f2937}
.session-item.active{background:#1f2937;border-left:3px solid #58a6ff}
.session-item .sid{font-size:11px;color:#8b949e;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .intent{font-size:13px;color:#e6edf3;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .smeta{font-size:11px;color:#6e7681;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.sbadge{padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}
.sbadge.active{background:#1a4030;color:#3fb950}
.sbadge.completed{background:#1e2b3a;color:#58a6ff}
.sbadge.blocked{background:#3d1f1f;color:#f85149}
.sbadge.error{background:#3d1f1f;color:#ffa657}

/* ── Main ─────────────────────────────────────────────────────────── */
.main{overflow-y:auto;padding:24px 28px;background:#0d1117}
.empty-state{display:flex;align-items:center;justify-content:center;height:60vh;color:#6e7681;font-size:15px;flex-direction:column;gap:8px}
.empty-state .big{font-size:36px}

/* ── Session Header ─────────────────────────────────────────────── */
.session-header{margin-bottom:20px}
.session-header h1{font-size:18px;font-weight:700;color:#e6edf3}
.session-header .sub{font-size:12px;color:#8b949e;margin-top:4px;font-family:monospace}

/* ── Stat chips ─────────────────────────────────────────────────── */
.stats-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.stat{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 16px;min-width:100px;text-align:center}
.stat .num{font-size:26px;font-weight:700}
.stat .lbl{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stat.allow .num{color:#3fb950}
.stat.watch .num{color:#d29922}
.stat.block .num{color:#f85149}
.stat.neutral .num{color:#58a6ff}
.stat.override .num{color:#bc8cff}

/* ── Sections ───────────────────────────────────────────────────── */
.section{margin-bottom:28px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#8b949e;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:#21262d}

/* ── Intent card ────────────────────────────────────────────────── */
.intent-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px 16px;font-size:14px;color:#e6edf3;line-height:1.5}
.intent-card .label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#8b949e;margin-bottom:4px}

/* ── Decision Trail ─────────────────────────────────────────────── */
.trail{position:relative}
.trail-item{display:flex;gap:0;margin-bottom:10px;position:relative}

.tl-spine{width:44px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.tl-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:2px}
.tl-dot.ALLOW{background:#3fb950}
.tl-dot.WATCH{background:#d29922}
.tl-dot.BLOCK{background:#f85149}
.tl-dot.override{background:#bc8cff}
.tl-connector{width:2px;flex:1;background:#21262d;margin-top:4px;min-height:20px}

.tl-card{flex:1;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 14px;margin-left:6px}
.tl-card.BLOCK{border-left:3px solid #f85149}
.tl-card.WATCH{border-left:3px solid #d29922}
.tl-card.ALLOW{border-left:3px solid #3fb950}
.tl-card.override{border-left:3px solid #bc8cff}

.tl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.tl-decision-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.05em;white-space:nowrap;flex-shrink:0}
.tl-decision-badge.ALLOW{background:#1a4030;color:#3fb950}
.tl-decision-badge.WATCH{background:#2d2008;color:#d29922}
.tl-decision-badge.BLOCK{background:#3d1f1f;color:#f85149}
.tl-decision-badge.override{background:#2a1f3a;color:#bc8cff}
.tl-engine-badge{font-size:9px;padding:2px 6px;border-radius:4px;background:#21262d;color:#8b949e;font-family:monospace}

.tl-reason{font-size:13px;color:#e6edf3;flex:1;line-height:1.4}
.tl-time{font-size:11px;color:#6e7681;white-space:nowrap}

.tl-trigger{font-size:11px;color:#8b949e;margin-top:5px;font-family:monospace;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl-trigger .tool-tag{background:#161b22;border:1px solid #30363d;padding:1px 7px;border-radius:4px;color:#58a6ff}
.tl-trigger .file-tag{background:#0d1117;border:1px solid #21262d;padding:1px 7px;border-radius:4px;color:#e6edf3;font-size:10px}

.tl-conf{font-size:11px;color:#6e7681;margin-top:4px}
.conf-bar-wrap{display:inline-block;width:80px;height:4px;background:#21262d;border-radius:2px;vertical-align:middle;margin:0 6px}
.conf-bar{height:100%;border-radius:2px}

.signal-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.signal-pill{font-size:10px;padding:2px 7px;border-radius:100px;font-weight:600;letter-spacing:.02em}
.signal-pill.TASK_DRIFT{background:#2d2008;color:#d29922}
.signal-pill.REPEATED_FAILURE{background:#3d1f1f;color:#f85149}
.signal-pill.SCOPE_EXPANSION{background:#1a2d3a;color:#58a6ff}
.signal-pill.HIGH_IMPACT_CHANGE{background:#3d1f00;color:#ffa657}
.signal-pill.UNCERTAINTY{background:#2a1f3a;color:#bc8cff}

/* ── Laya Q&A panel ─────────────────────────────────────────────── */
.laya-panel{margin-top:10px;border:1px solid #21262d;border-radius:6px;overflow:hidden}
.laya-panel-head{background:#0d1117;padding:6px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#8b949e;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.laya-panel-head .toggle{font-size:12px;transition:transform .15s;display:inline-block}
.laya-panel-head.open .toggle{transform:rotate(90deg)}
.laya-qa{display:none;padding:8px 12px;background:#0d1117;border-top:1px solid #21262d}
.laya-qa.open{display:block}
.laya-qa-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #161b22;font-size:12px}
.laya-qa-row:last-child{border-bottom:none}
.laya-qa-row .q{color:#8b949e;font-family:monospace;font-size:11px;overflow:hidden;text-overflow:ellipsis}
.laya-qa-row .choice{font-family:monospace;font-size:11px;color:#e6edf3}
.laya-qa-row .dec{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}

/* ── Signals section ─────────────────────────────────────────────── */
.signal-row{display:flex;align-items:center;gap:10px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin-bottom:8px;flex-wrap:wrap}
.signal-type{font-size:11px;font-weight:700;min-width:170px;color:#e6edf3;letter-spacing:.02em}
.signal-bar-wrap{flex:1;min-width:80px;background:#21262d;border-radius:3px;height:6px;overflow:hidden}
.signal-bar{height:100%;border-radius:3px}
.signal-bar.high{background:#f85149}
.signal-bar.med{background:#d29922}
.signal-bar.low{background:#3fb950}
.signal-sev{font-size:11px;color:#8b949e;min-width:34px;text-align:right}
.signal-detail{font-size:11px;color:#6e7681;flex-basis:100%;margin-top:2px}

/* ── Actions log ─────────────────────────────────────────────────── */
.actions-table{width:100%;border-collapse:collapse;font-size:12px}
.actions-table th{text-align:left;padding:6px 10px;border-bottom:1px solid #30363d;color:#8b949e;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.actions-table td{padding:7px 10px;border-bottom:1px solid #21262d;vertical-align:top}
.actions-table tr:last-child td{border-bottom:none}
.actions-table .tool-cell{color:#58a6ff;font-family:monospace;white-space:nowrap}
.actions-table .files-cell{color:#8b949e;font-size:11px;word-break:break-all}
.actions-table .time-cell{color:#6e7681;white-space:nowrap;font-family:monospace}
.no-actions{color:#6e7681;font-size:13px;padding:12px 0}

/* ── Failures section ────────────────────────────────────────────── */
.failure-row{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.failure-sig{font-size:12px;font-family:monospace;color:#e6edf3;flex:1;min-width:200px}
.failure-count{font-size:18px;font-weight:700;color:#f85149;min-width:36px;text-align:right}
.failure-prog{font-size:10px;padding:2px 7px;border-radius:4px}
.failure-prog.yes{background:#1a4030;color:#3fb950}
.failure-prog.no{background:#3d1f1f;color:#f85149}

/* ── Scrollbars ───────────────────────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0d1117}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

/* ── Responsive ───────────────────────────────────────────────────── */
@media(max-width:640px){
  .app{grid-template-columns:1fr}
  .sidebar{max-height:220px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">Sessions</div>
    <div class="sidebar-sessions" id="sidebar-sessions"></div>
  </aside>
  <main class="main" id="main">
    <div class="empty-state" id="empty-state">
      <div class="big">🤖</div>
      <div>Select a session to inspect its decision trail</div>
    </div>
    <div id="session-view" style="display:none"></div>
  </main>
</div>

t commit -m \"docs(vscode-extension): add Quick Install via Bob IDE plugin section\""},"output":"[main e0b98cf] docs(vscode-extension): add Quick Install via Bob IDE plugin section\n 1 file changed, 9 insertions(+)","files":[],"timestamp":1790507552662},{"tool":"read_file","input":{"path":"README.md"},"output":{},"files":["README.md"],"timestamp":1790507602333},{"tool":"read_file","input":{"path":"README.md"},"output":"Contents of file README.md:\n\n1 | # Bobtention\n2 | \n3 | > **Human attention router for IBM Bob.** Lets Bob work autonomously and interrupts you only when the session gives a meaningful reason to pay attention.\n4 | \n5 | Bobtention runs as a set of [IBM Bob](https://www.ibm.com/bob) hook scripts. It tracks the trajectory of every Bob coding session — task alignment, progress, scope, action impact, and uncertainty — and routes attention using an **Allow / Watch / Block** decision model. When Bob is working normally Bobtention stays invisible. When Bob gets stuck, drifts off task, or reaches a high-impact action, Bobtention stops Bob and explains why.\n6 | \n7 | ---\n8 | \n9 | ## How It Works\n10 | \n11 | ```\n12 | Developer prompt\n13 |       │\n14 |       ▼\n15 |  UserPromptSubmit ──→ capture intent\n16 |       │\n17 |       ▼ (for each tool use)\n18 |   PreToolUse ──→ evaluate ──→ ALLOW → continue\n19 |                           └──→ WATCH → continue + log\n20 |                           └──→ BLOCK → stop + explain\n21 |       │\n22 |   PostToolUse ──→ observe outcome, accumulate signals\n23 |       │\n24 |     Stop ──→ finalize session\n25 | ```\n26 | \n27 | **Decision model**\n28 | \n29 | | Decision | Meaning |\n30 | |----------|---------|\n31 | | `ALLOW`  | No concern — Bob continues uninterrupted |\n32 | | `WATCH`  | Low concern — logged, no interruption |\n33 | | `BLOCK`  | Action stopped, human attention required |\n34 | \n35 | **Attention signals detected**\n36 | \n37 | | Signal | Trigger |\n38 | |--------|---------|\n39 | | `TASK_DRIFT` | Activity diverges from the original intent or initial file scope |\n40 | | `REPEATED_FAILURE` | Same test/build failure ≥ N times without progress |\n41 | | `SCOPE_EXPANSION` | Touched directories expand well beyond the initial working set |\n42 | | `HIGH_IMPACT_CHANGE` | File path matches a destructive, credential, schema, or deployment pattern |\n43 | | `UNCERTAINTY` | Rapid direction changes across many unrelated modules |\n44 | \n45 | ---\n46 | \n47 | ## Installation\n48 | \n49 | ### Prerequisites\n50 | \n51 | - Node.js ≥ 18\n52 | - An IBM Bob workspace\n53 | - `npm run build` output in `dist/` (see below)\n54 | - **Self-hosted Laya** running at `http://localhost:8000` (required for AI-powered decisions — see [Using Laya](#using-laya) below). Without it, Bobtention falls back to local threshold rules automatically.\n55 | \n56 | ### Quick install (any Bob workspace)\n57 | \n58 | ```bash\n59 | # From the Bobtention repo root:\n60 | ./scripts/install.sh /path/to/your-workspace\n61 | \n62 | # Or install into the current directory:\n63 | ./scripts/install.sh\n64 | ```\n65 | \n66 | The installer:\n67 | 1. Builds `dist/hooks/*.js`\n68 | 2. Creates a default `bobtention.config.json` in the target workspace (if absent)\n69 | 3. Registers all 5 hooks in `.bob/settings.json`\n70 | 4. Creates `~/.bobtention/sessions/` and `~/.bobtention/logs/`\n71 | \n72 | ### Manual install\n73 | \n74 | ```bash\n75 | npm run build\n76 | ```\n77 | \n78 | Then add the following to `.bob/settings.json` in your workspace (adjust paths):\n79 | \n80 | ```json\n81 | {\n82 |   \"hooks\": {\n83 |     \"SessionStart\": [{ \"matcher\": \".*\", \"hooks\": [{ \"type\": \"command\", \"command\": \"node /path/to/bobtention/dist/hooks/session-start.js\", \"timeout\": 5 }] }],\n84 |     \"UserPromptSubmit\": [{ \"matcher\": \".*\", \"hooks\": [{ \"type\": \"command\", \"command\": \"node /path/to/bobtention/dist/hooks/user-prompt-submit.js\", \"timeout\": 5 }] }],\n85 |     \"PreToolUse\": [{ \"matcher\": \".*\", \"hooks\": [{ \"type\": \"command\", \"command\": \"node /path/to/bobtention/dist/hooks/pre-tool-use.js\", \"timeout\": 10 }] }],\n86 |     \"PostToolUse\": [{ \"matcher\": \".*\", \"hooks\": [{ \"type\": \"command\", \"command\": \"node /path/to/bobtention/dist/hooks/post-tool-use.js\", \"timeout\": 5 }] }],\n87 |     \"Stop\": [{ \"matcher\": \".*\", \"hooks\": [{ \"type\": \"command\", \"command\": \"node /path/to/bobtention/dist/hooks/stop.js\", \"timeout\": 5 }] }]\n88 |   }\n89 | }\n90 | ```\n91 | \n92 | ---\n93 | \n94 | ## Configuration\n95 | \n96 | Create `bobtention.config.json` in the workspace root. All fields are optional — the defaults shown below are applied automatically.\n97 | \n98 | ```json\n99 | {\n100 |   \"enabled\": true,\n101 |   \"decisionEngine\": {\n102 |     \"provider\": \"laya\",\n103 |     \"endpoint\": \"http://localhost:8000/v1/systemone\",\n104 |     \"timeout\": 3000\n105 |   },\n106 |   \"autonomy\": {\n107 |     \"watchThreshold\": 0.55,\n108 |     \"blockThreshold\": 0.85\n109 |   },\n110 |   \"signals\": {\n111 |     \"taskDrift\": true,\n112 |     \"repeatedFailure\": true,\n113 |     \"scopeExpansion\": true,\n114 |     \"highImpactAction\": true,\n115 |     \"uncertainty\": true\n116 |   },\n117 |   \"highImpactPatterns\": [\n118 |     { \"pattern\": \"delete|remove|drop|truncate\", \"category\": \"destructive\" },\n119 |     { \"pattern\": \"migration|schema\",             \"category\": \"schema-change\" },\n120 |     { \"pattern\": \"\\\\.env|secret|credential|password|token|key\", \"category\": \"credentials\" },\n121 |     { \"pattern\": \"deploy|release|publish\",       \"category\": \"deployment\" }\n122 |   ],\n123 |   \"humanOverride\": { \"enabled\": true },\n124 |   \"session\": {\n125 |     \"maxActions\": 50,\n126 |     \"storagePath\": \"~/.bobtention/sessions\"\n127 |   }\n128 | }\n129 | ```\n130 | \n131 | ### Using Laya\n132 | \n133 | Bobtention integrates with a **self-hosted Laya** instance for AI-powered attention decisions.\n134 | \n135 | **Start Laya locally before using Bobtention:**\n136 | \n137 | https://laya-ai.com/guides/self-host-laya\n138 | \n139 | Bobtention uses Laya's **multi-question guardrail pattern** (`POST /v1/systemone`). Each evaluation sends a compact `state` body (task intent, current action, recent action history, failure summary — no raw file contents) together with a set of focused `choice` questions, one per concern:\n140 | \n141 | | Question | What Laya reasons about |\n142 | |---|---|\n143 | | `intent_alignment` | Does the current tool + files match the stated task? |\n144 | | `guardrail_high_impact_change` | Is this specific file change routine or must-review? |\n145 | | `guardrail_task_drift` | Is this drift acceptable exploration or off-course? |\n146 | | `guardrail_repeated_failure` | Is the agent still making progress or looping? |\n147 | | `guardrail_scope_expansion` | Is the expanded scope justified by the task? |\n148 | | `guardrail_uncertainty` | Is the agent legitimately exploring or thrashing? |\n149 | \n150 | Each guardrail question includes the signal's **detail text** (e.g. `File \"prod.env\" matches pattern \".env|secret\"`) so Laya reasons about the actual evidence, not a generic label. This lets Laya override a signal when context makes it safe — a `HIGH_IMPACT_CHANGE` on a test fixture is not the same as one on a production schema.\n151 | \n152 | Answers are aggregated: worst-case decision wins (`BLOCK > WATCH > ALLOW`), confidence is a weighted average biased toward the worst-case answer, and the `reason` field lists every non-ALLOW concern.\n153 | \n154 | Set `decisionEngine.provider` to `\"laya\"` and confirm the `endpoint` points to your running instance. If Laya is unavailable or returns an error, Bobtention automatically falls back to the local threshold rule engine — Bob is never blocked by a down Laya instance.\n155 | \n156 | To use only the local rule engine (no Laya required):\n157 | \n158 | ```json\n159 | {\n160 |   \"decisionEngine\": {\n161 |     \"provider\": \"local\"\n162 |   }\n163 | }\n164 | ```\n165 | \n166 | ### Configuration resolution order\n167 | \n168 | Last wins:\n169 | 1. Built-in defaults\n170 | 2. `~/.bobtention/config.json` (global)\n171 | 3. `bobtention.config.json` in the current workspace\n172 | \n173 | ---\n174 | \n175 | ## Human Override\n176 | \n177 | When Bobtention blocks an action, Bob stops and prints an explanation to stderr:\n178 | \n179 | ```\n180 | ⚠ Bobtention — human attention required\n181 | ────────────────────────────────────────\n182 | Possible task drift.\n183 | \n184 | Task:    Implement OAuth login\n185 | Current: src/payment/PaymentService.kt\n186 | \n187 | Signals: Task drift, Scope expansion\n188 | ────────────────────────────────────────\n189 | Run `npx bobtention override` to continue.\n190 | ```\n191 | \n192 | To unblock, run from any terminal in your workspace:\n193 | \n194 | ```bash\n195 | npx bobtention override\n196 | # or, targeting a specific session:\n197 | npx bobtention override --session \u003csession-id>\n198 | # with a custom reason:\n199 | npx bobtention override --session \u003csession-id> --reason \"payment work is intentional\"\n200 | ```\n201 | \n202 | The override is **single-use** — it authorises exactly one action, then Bobtention resumes normal monitoring.\n203 | \n204 | ---\n205 | \n206 | ## Architecture\n207 | \n208 | ```\n209 | src/\n210 | ├── hooks/          # Bob entry points (session-start, user-prompt-submit,\n211 | │                   #   pre-tool-use, post-tool-use, stop)\n212 | ├── core/\n213 | │   ├── config.ts              # Config loader (3-level merge)\n214 | │   ├── event-normalizer.ts    # Bob raw payloads → NormalizedEvent\n215 | │   ├── session-manager.ts     # Session state: init, update, persist, finalize\n216 | │   ├── signal-extractor.ts    # 5 attention signal detectors (with detail text)\n217 | │   ├── context-builder.ts     # Builds DecisionContext; preserves signal detail\n218 | │   ├── attention-evaluator.ts # Fast ALLOW / deterministic BLOCK / engine path\n219 | │   ├── enforcement.ts         # Decision → exit code + deferredBlock\n220 | │   └── notification.ts        # stderr message formatting\n221 | ├── adapters/\n222 | │   └── decision-adapter.ts    # LayaAdapter (multi-question guardrails) +\n223 | │                              #   LocalRuleAdapter (threshold fallback)\n224 | ├── types/\n225 | │   └── index.ts               # All shared TS types\n226 | └── utils/\n227 |     ├── errors.ts              # Fail-open hook wrapper (runHook)\n228 |     └── logger.ts              # Structured stderr logger\n229 | \n230 | scripts/\n231 | ├── override.ts    # `npx bobtention override` CLI\n232 | ├── install.sh     # Workspace installer\n233 | └── demo.sh        # Interactive demo (5 acts)\n234 | \n235 | tests/\n236 | ├── integration/\n237 | │   └── e2e-lifecycle.test.ts  # Full hook lifecycle + 5 demo scenarios\n238 | ├── core/                      # Unit tests per module\n239 | ├── adapters/                  # Decision adapter tests\n240 | └── utils/                     # Error wrapper tests\n241 | ```\n242 | \n243 | ### Key invariants\n244 | \n245 | - **Fail-open:** Every hook is wrapped in try/catch. Internal errors → exit 0 + stderr log. Bob never sees a spurious BLOCK from an internal failure.\n246 | - **stdout / stderr separation:** Only `SessionStart` and `UserPromptSubmit` write to stdout (context injected by Bob). All notification messages go to stderr.\n247 | - **PostToolUse never exits 2.** Concerns detected after an action are written as `deferredBlock` and enforced by the *next* `PreToolUse`.\n248 | - **Signals accumulate.** Existing signals are never cleared on a new event — severity escalates with repeated evidence.\n249 | - **Override is single-use.** `pendingOverride` is removed from session state immediately after the first PreToolUse consumes it.\n250 | \n251 | ---\n252 | \n253 | ## Demo\n254 | \n255 | Run the 5-act demo script (requires a built `dist/`):\n256 | \n257 | ```bash\n258 | npm run build\n259 | ./scripts/demo.sh          # all 5 acts\n260 | ./scripts/demo.sh 1        # Act 1: Normal work — no interruption\n261 | ./scripts/demo.sh 2        # Act 2: Stuck (repeated test failure → BLOCK)\n262 | ./scripts/demo.sh 3        # Act 3: Task drift (OAuth → PaymentService → BLOCK)\n263 | ./scripts/demo.sh 4        # Act 4: Human override → continue\n264 | ./scripts/demo.sh 5        # Act 5: High-impact change (migration file → WATCH/BLOCK)\n265 | ```\n266 | \n267 | Each act pipes simulated Bob hook JSON payloads through the compiled hook scripts, printing all `⚠ BLOCK` and `◐ WATCH` messages as Bob would see them.\n268 | \n269 | ---\n270 | \n271 | ## Development\n272 | \n273 | ```bash\n274 | npm run build        # compile src/ → dist/\n275 | npm test             # vitest (161 tests)\n276 | npm run typecheck    # tsc --noEmit (both tsconfigs)\n277 | npm run lint         # eslint\n278 | npm run format       # prettier\n279 | ```\n280 | \n281 | Session files are written to `~/.bobtention/sessions/\u003csession-id>.json`.  \n282 | Logs go to `~/.bobtention/logs/`.\n283 | \n284 | ---\n285 | \n286 | ## License\n287 | \n288 | MIT — see [LICENSE](LICENSE).\n289 | ","files":["README.md"],"timestamp":1790507602528},{"tool":"apply_diff","input":{"path":"README.md","diff":"\u003c\u003c\u003c\u003c\u003c\u003c\u003c SEARCH\n:start_line:56\n-------\n### Quick install (any Bob workspace)\n\n```bash\n# From the Bobtention repo root:\n./scripts/install.sh /path/to/your-workspace\n\n# Or install into the current directory:\n./scripts/install.sh\n```\n\nThe installer:\n1. Builds `dist/hooks/*.js`\n2. Creates a default `bobtention.config.json` in the target workspace (if absent)\n3. Registers all 5 hooks in `.bob/settings.json`\n4. Creates `~/.bobtention/sessions/` and `~/.bobtention/logs/`\n=======\n### Quick install (any Bob workspace)\n\n**Option A — Bob IDE plugin (recommended):**\n\n1. Open the \":1790507602333},{\"tool\":\"read_file\",\"input\":{\"path\":\"README.md\"},\"output\":\"Contents of file README.md:\\n\\n1 | # Bobtention\\n2 | \\n3 | > **Human attention router for IBM Bob.** Lets Bob work autonomously and interrupts you only when the session gives a meaningful reason to pay attention.\\n4 | \\n5 | Bobtention runs as a set of [IBM Bob](https://www.ibm.com/bob) hook scripts. It tracks the trajectory of every Bob coding session — task alignment, progress, scope, action impact, and uncertainty — and routes attention using an **Allow / Watch / Block** decision model. When Bob is working normally Bobtention stays invisible. When Bob gets stuck, drifts off task, or reaches a high-impact action, Bobtention stops Bob and explains why.\\n6 | \\n7 | ---\\n8 | \\n9 | ## How It Works\\n10 | \\n11 | ```\\n12 | Developer prompt\\n13 |       │\\n14 |       ▼\\n15 |  UserPromptSubmit ──→ capture intent\\n16 |       │\\n17 |       ▼ (for each tool use)\\n18 |   PreToolUse ──→ evaluate ──→ ALLOW → continue\\n19 |                           └──→ WATCH → continue + log\\n20 |                           └──→ BLOCK → stop + explain\\n21 |       │\\n22 |   PostToolUse ──→ observe outcome, accumulate signals\\n23 |       │\\n24 |     Stop ──→ finalize session\\n25 | ```\\n26 | \\n27 | **Decision model**\\n28 | \\n29 | | Decision | Meaning |\\n30 | |----------|---------|\\n31 | | `ALLOW`  | No concern — Bob continues uninterrupted |\\n32 | | `WATCH`  | Low concern — logged, no interruption |\\n33 | | `BLOCK`  | Action stopped, human attention required |\\n34 | \\n35 | **Attention signals detected**\\n36 | \\n37 | | Signal | Trigger |\\n38 | |--------|---------|\\n39 | | `TASK_DRIFT` | Activity diverges from the original intent or initial file scope |\\n40 | | `REPEATED_FAILURE` | Same test/build failure ≥ N times without progress |\\n41 | | `SCOPE_EXPANSION` | Touched directories expand well beyond the initial working set |\\n42 | | `HIGH_IMPACT_CHANGE` | File path matches a destructive, credential, schema, or deployment pattern |\\n43 | | `UNCERTAINTY` | Rapid direction changes across many unrelated modules |\\n44 | \\n45 | ---\\n46 | \\n47 | ## Installation\\n48 | \\n49 | ### Prerequisites\\n50 | \\n51 | - Node.js ≥ 18\\n52 | - An IBM Bob workspace\\n53 | - `npm run build` output in `dist/` (see below)\\n54 | - **Self-hosted Laya** running at `http://localhost:8000` (required for AI-powered decisions — see [Using Laya](#using-laya) below). Without it, Bobtention falls back to local threshold rules automatically.\\n55 | \\n56 | ### Quick install (any Bob workspace)\\n57 | \\n58 | ```bash\\n59 | # From the Bobtention repo root:\\n60 | ./scripts/install.sh /path/to/your-workspace\\n61 | \\n62 | # Or install into the current directory:\\n63 | ./scripts/install.sh\\n64 | ```\\n65 | \\n66 | The installer:\\n67 | 1. Builds `dist/hooks/*.js`\\n68 | 2. Creates a default `bobtention.config.json` in the target workspace (if absent)\\n69 | 3. Registers all 5 hooks in `.bob/settings.json`\\n70 | 4. Creates `~/.bobtention/sessions/` and `~/.bobtention/logs/`\\n71 | \\n72 | ### Manual install\\n73 | \\n74 | ```bash\\n75 | npm run build\\n76 | ```\\n77 | \\n78 | Then add the following to `.bob/settings.json` in your workspace (adjust paths):\\n79 | \\n80 | ```json\\n81 | {\\n82 |   \\\"hooks\\\": {\\n83 |     \\\"SessionStart\\\": [{ \\\"matcher\\\": \\\".*\\\", \\\"hooks\\\": [{ \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"node /path/to/bobtention/dist/hooks/session-start.js\\\", \\\"timeout\\\": 5 }] }],\\n84 |     \\\"UserPromptSubmit\\\": [{ \\\"matcher\\\": \\\".*\\\", \\\"hooks\\\": [{ \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"node /path/to/bobtention/dist/hooks/user-prompt-submit.js\\\", \\\"timeout\\\": 5 }] }],\\n85 |     \\\"PreToolUse\\\": [{ \\\"matcher\\\": \\\".*\\\", \\\"hooks\\\": [{ \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"node /path/to/bobtention/dist/hooks/pre-tool-use.js\\\", \\\"timeout\\\": 10 }] }],\\n86 |     \\\"PostToolUse\\\": [{ \\\"matcher\\\": \\\".*\\\", \\\"hooks\\\": [{ \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"node /path/to/bobtention/dist/hooks/post-tool-use.js\\\", \\\"timeout\\\": 5 }] }],\\n87 |     \\\"Stop\\\": [{ \\\"matcher\\\": \\\".*\\\", \\\"hooks\\\": [{ \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"node /path/to/bobtention/dist/hooks/stop.js\\\", \\\"timeout\\\": 5 }] }]\\n88 |   }\\n89 | }\\n90 | ```\\n91 | \\n92 | ---\\n93 | \\n94 | ## Configuration\\n95 | \\n96 | Create `bobtention.config.json` in the workspace root. All fields are optional — the defaults shown below are applied automatically.\\n97 | \\n98 | ```json\\n99 | {\\n100 |   \\\"enabled\\\": true,\\n101 |   \\\"decisionEngine\\\": {\\n102 |     \\\"provider\\\": \\\"laya\\\",\\n103 |     \\\"endpoint\\\": \\\"http://localhost:8000/v1/systemone\\\",\\n104 |     \\\"timeout\\\": 3000\\n105 |   },\\n106 |   \\\"autonomy\\\": {\\n107 |     \\\"watchThreshold\\\": 0.55,\\n108 |     \\\"blockThreshold\\\": 0.85\\n109 |   },\\n110 |   \\\"signals\\\": {\\n111 |     \\\"taskDrift\\\": true,\\n112 |     \\\"repeatedFailure\\\": true,\\n113 |     \\\"scopeExpansion\\\": true,\\n114 |     \\\"highImpactAction\\\": true,\\n115 |     \\\"uncertainty\\\": true\\n116 |   },\\n117 |   \\\"highImpactPatterns\\\": [\\n118 |     { \\\"pattern\\\": \\\"delete|remove|drop|truncate\\\", \\\"category\\\": \\\"destructive\\\" },\\n119 |     { \\\"pattern\\\": \\\"migration|schema\\\",             \\\"category\\\": \\\"schema-change\\\" },\\n120 |     { \\\"pattern\\\": \\\"\\\\\\\\.env|secret|credential|password|token|key\\\", \\\"category\\\": \\\"credentials\\\" },\\n121 |     { \\\"pattern\\\": \\\"deploy|release|publish\\\",       \\\"category\\\": \\\"deployment\\\" }\\n122 |   ],\\n123 |   \\\"humanOverride\\\": { \\\"enabled\\\": true },\\n124 |   \\\"session\\\": {\\n125 |     \\\"maxActions\\\": 50,\\n126 |     \\\"storagePath\\\": \\\"~/.bobtention/sessions\\\"\\n127 |   }\\n128 | }\\n129 | ```\\n130 | \\n131 | ### Using Laya\\n132 | \\n133 | Bobtention integrates with a **self-hosted Laya** instance for AI-powered attention decisions.\\n134 | \\n135 | **Start Laya locally before using Bobtention:**\\n136 | \\n137 | https://laya-ai.com/guides/self-host-laya\\n138 | \\n139 | Bobtention uses Laya's **multi-question guardrail pattern** (`POST /v1/systemone`). Each evaluation sends a compact `state` body (task intent, current action, recent action history, failure summary — no raw file contents) together with a set of focused `choice` questions, one per concern:\\n140 | \\n141 | | Question | What Laya reasons about |\\n142 | |---|---|\\n143 | | `intent_alignment` | Does the current tool + files match the stated task? |\\n144 | | `guardrail_high_impact_change` | Is this specific file change routine or must-review? |\\n145 | | `guardrail_task_drift` | Is this drift acceptable exploration or off-course? |\\n146 | | `guardrail_repeated_failure` | Is the agent still making progress or looping? |\\n147 | | `guardrail_scope_expansion` | Is the expanded scope justified by the task? |\\n148 | | `guardrail_uncertainty` | Is the agent legitimately exploring or thrashing? |\\n149 | \\n150 | Each guardrail question includes the signal's **detail text** (e.g. `File \\\"prod.env\\\" matches pattern \\\".env|secret\\\"`) so Laya reasons about the actual evidence, not a generic label. This lets Laya override a signal when context makes it safe — a `HIGH_IMPACT_CHANGE` on a test fixture is not the same as one on a production schema.\\n151 | \\n152 | Answers are aggregated: worst-case decision wins (`BLOCK > WATCH > ALLOW`), confidence is a weighted average biased toward the worst-case answer, and the `reason` field lists every non-ALLOW concern.\\n153 | \\n154 | Set `decisionEngine.provider` to `\\\"laya\\\"` and confirm the `endpoint` points to your running instance. If Laya is unavailable or returns an error, Bobtention automatically falls back to the local threshold rule engine — Bob is never blocked by a down Laya instance.\\n155 | \\n156 | To use only the local rule engine (no Laya required):\\n157 | \\n158 | ```json\\n159 | {\\n160 |   \\\"decisionEngine\\\": {\\n161 |     \\\"provider\\\": \\\"local\\\"\\n162 |   }\\n163 | }\\n164 | ```\\n165 | \\n166 | ### Configuration resolution order\\n167 | \\n168 | Last wins:\\n169 | 1. Built-in defaults\\n170 | 2. `~/.bobtention/config.json` (global)\\n171 | 3. `bobtention.config.json` in the current workspace\\n172 | \\n173 | ---\\n174 | \\n175 | ## Human Override\\n176 | \\n177 | When Bobtention blocks an action, Bob stops and prints an explanation to stderr:\\n178 | \\n179 | ```\\n180 | ⚠ Bobtention — human attention required\\n181 | ────────────────────────────────────────\\n182 | Possible task drift.\\n183 | \\n184 | Task:    Implement OAuth login\\n185 | Current: src/payment/PaymentService.kt\\n186 | \\n187 | Signals: Task drift, Scope expansion\\n188 | ────────────────────────────────────────\\n189 | Run `npx bobtention override` to continue.\\n190 | ```\\n191 | \\n192 | To unblock, run from any terminal in your workspace:\\n193 | \\n194 | ```bash\\n195 | npx bobtention override\\n196 | # or, targeting a specific session:\\n197 | npx bobtention override --session \\u003csession-id>\\n198 | # with a custom reason:\\n199 | npx bobtention override --session \\u003csession-id> --reason \\\"payment work is intentional\\\"\\n200 | ```\\n201 | \\n202 | The override is **single-use** — it authorises exactly one action, then Bobtention resumes normal monitoring.\\n203 | \\n204 | ---\\n205 | \\n206 | ## Architecture\\n207 | \\n208 | ```\\n209 | src/\\n210 | ├── hooks/          # Bob entry points (session-start, user-prompt-submit,\\n211 | │                   #   pre-tool-use, post-tool-use, stop)\\n212 | ├── core/\\n213 | │   ├── config.ts              # Config loader (3-level merge)\\n214 | │   ├── event-normalizer.ts    # Bob raw payloads → NormalizedEvent\\n215 | │   ├── session-manager.ts     # Session state: init, update, persist, finalize\\n216 | │   ├── signal-extractor.ts    # 5 attention signal detectors (with detail text)\\n217 | │   ├── context-builder.ts     # Builds DecisionContext; preserves signal detail\\n218 | │   ├── attention-evaluator.ts # Fast ALLOW / deterministic BLOCK / engine path\\n219 | │   ├── enforcement.ts         # Decision → exit code + deferredBlock\\n220 | │   └── notification.ts        # stderr message formatting\\n221 | ├── adapters/\\n222 | │   └── decision-adapter.ts    # LayaAdapter (multi-question guardrails) +\\n223 | │                              #   LocalRuleAdapter (threshold fallback)\\n224 | ├── types/\\n225 | │   └── index.ts               # All shared TS types\\n226 | └── utils/\\n227 |     ├── errors.ts              # Fail-open hook wrapper (runHook)\\n228 |     └── logger.ts              # Structured stderr logger\\n229 | \\n230 | scripts/\\n231 | ├── override.ts    # `npx bobtention override` CLI\\n232 | ├── install.sh     # Workspace installer\\n233 | └── demo.sh        # Interactive demo (5 acts)\\n234 | \\n235 | tests/\\n236 | ├── integration/\\n237 | │   └── e2e-lifecycle.test.ts  # Full hook lifecycle + 5 demo scenarios\\n238 | ├── core/                      # Unit tests per module\\n239 | ├── adapters/                  # Decision adapter tests\\n240 | └── utils/                     # Error wrapper tests\\n241 | ```\\n242 | \\n243 | ### Key invariants\\n244 | \\n245 | - **Fail-open:** Every hook is wrapped in try/catch. Internal errors → exit 0 + stderr log. Bob never sees a spurious BLOCK from an internal failure.\\n246 | - **stdout / stderr separation:** Only `SessionStart` and `UserPromptSubmit` write to stdout (context injected by Bob). All notification messages go to stderr.\\n247 | - **PostToolUse never exits 2.** Concerns detected after an action are written as `deferredBlock` and enforced by the *next* `PreToolUse`.\\n248 | - **Signals accumulate.** Existing signals // ── Helpers ─────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function fmt(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function fmtDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

function elapsed(startTs) {
  if (!startTs) return '—';
  const s = Math.floor((Date.now() - startTs) / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
  return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
}

function confColor(c) {
  if (c >= 0.8) return '#f85149';
  if (c >= 0.5) return '#d29922';
  return '#3fb950';
}

function decClass(d) {
  if (d === 'BLOCK') return 'BLOCK';
  if (d === 'WATCH') return 'WATCH';
  if (d === 'override') return 'override';
  return 'ALLOW';
}

// ── Sidebar ──────────────────────────────────────────────────────────────────

function buildSidebar() {
  const el = document.getElementById('sidebar-sessions');
  if (!SESSIONS.length) {
    el.innerHTML = '<div style="padding:16px;color:#6e7681;font-size:12px">No sessions yet</div>';
    return;
  }
  el.innerHTML = SESSIONS.map((s, i) => {
    const counts = countDecisions(s);
    const statusCls = {active:'active',completed:'completed',blocked:'blocked',error:'error'}[s.status] ?? 'active';
    return `<div class="session-item${i===0?' active':''}" onclick="selectSession(${i})" id="si${i}">
      <div class="sid">${esc(s.sessionId)}</div>
      <div class="intent">${esc(s.originalIntent || '(no intent)')}</div>
      <div class="smeta">
        <span class="sbadge ${statusCls}">${esc(s.status)}</span>
        <span style="color:#f85149">${counts.block}✗</span>
        <span style="color:#d29922">${counts.watch}◉</span>
        <span style="color:#3fb950">${counts.allow}✓</span>
      </div>
    </div>`;
  }).join('');
}

// ── Session view ─────────────────────────────────────────────────────────────

let currentIdx = -1;

function selectSession(idx) {
  currentIdx = idx;
  // update active sidebar item
  document.querySelectorAll('.session-item').forEach((el,i) => {
    el.classList.toggle('active', i === idx);
  });
  document.getElementById('empty-state').style.display = 'none';
  const view = document.getElementById('session-view');
  view.style.display = 'block';
  view.innerHTML = renderSession(SESSIONS[idx]);
}

function countDecisions(s) {
  const d = s.decisions ?? [];
  return {
    allow: d.filter(x => x.decision === 'ALLOW').length,
    watch: d.filter(x => x.decision === 'WATCH').length,
    block: d.filter(x => x.decision === 'BLOCK').length,
    override: d.filter(x => x.engine === 'override').length,
  };
}

function renderSession(s) {
  const counts = countDecisions(s);
  const decisions = s.decisions ?? [];
  const signals = s.signals ?? [];
  const actions = s.actions ?? [];
  const failures = s.failures ?? [];

  return `
    ${renderHeader(s)}
    ${renderStats(counts, actions, signals)}
    ${renderIntent(s)}
    ${renderBlockedAlert(s)}
    ${renderDecisionTrail(decisions)}
    ${renderSignals(signals)}
    ${renderActions(actions)}
    ${renderFailures(failures)}
  `;
}

// ── Header ──────────────────────────────────────────────────────────────────

function renderHeader(s) {
  const statusCls = {active:'active',completed:'completed',blocked:'blocked',error:'error'}[s.status] ?? 'active';
  return `
    <div class="session-header">
      <h1>${esc(s.originalIntent || 'Untitled Session')}</h1>
      <div class="sub">
        ${esc(s.sessionId)}
        &nbsp;·&nbsp; Started ${fmtDate(s.startTime)}
        &nbsp;·&nbsp; Duration ${elapsed(s.startTime)}
        &nbsp;·&nbsp; <span class="sbadge ${statusCls}">${esc(s.status)}</span>
      </div>
    </div>
  `;
}

// ── Stats ────────────────────────────────────────────────────────────────────

function renderStats(counts, actions, signals) {
  return `
    <div class="stats-row">
      <div class="stat allow"><div class="num">${counts.allow}</div><div class="lbl">Allow</div></div>
      <div class="stat watch"><div class="num">${counts.watch}</div><div class="lbl">Watch</div></div>
      <div class="stat block"><div class="num">${counts.block}</div><div class="lbl">Block</div></div>
      <div class="stat override"><div class="num">${counts.override}</div><div class="lbl">Override</div></div>
      <div class="stat neutral"><div class="num">${actions.length}</div><div class="lbl">Actions</div></div>
      <div class="stat neutral"><div class="num">${signals.length}</div><div class="lbl">Signals</div></div>
    </div>
  `;
}

// ── Intent ───────────────────────────────────────────────────────────────────

function renderIntent(s) {
  if (!s.originalIntent) return '';
  return `
    <div class="section">
      <div class="section-title">Original Intent</div>
      <div class="intent-card">
        <div class="label">What the agent was asked to do</div>
        ${esc(s.originalIntent)}
      </div>
    </div>
  `;
}

// ── Blocked alert ─────────────────────────────────────────────────────────────

function renderBlockedAlert(s) {
  if (!s.blockedAction) return '';
  const b = s.blockedAction;
  return `
    <div style="background:#3d1f1f;border:1px solid #f85149;border-radius:8px;padding:12px 16px;margin-bottom:20px">
      <div style="font-size:12px;font-weight:700;color:#f85149;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">⛔ Last Blocked Action</div>
      <div style="font-size:13px;color:#e6edf3">${esc(b.reason)}</div>
      <div style="margin-top:6px;font-size:11px;color:#8b949e;font-family:monospace">
        <span style="color:#58a6ff">${esc(b.tool)}</span>
        ${(b.files??[]).map(f=>`<span style="margin-left:6px">${esc(f)}</span>`).join('')}
        &nbsp;·&nbsp; ${fmt(b.timestamp)}
      </div>
    </div>
  `;
}

// ── Decision Trail ───────────────────────────────────────────────────────────

function renderDecisionTrail(decisions) {
  if (!decisions.length) {
    return `<div class="section"><div class="section-title">Decision Trail</div><div class="no-actions">No decisions recorded yet.</div></div>`;
  }
  const items = decisions.map((d, i) => {
    const dec = d.decision ?? 'ALLOW';
    const eng = d.engine ?? 'deterministic';
    const decCls = eng === 'override' ? 'override' : dec;
    const conf = typeof d.confidence === 'number' ? d.confidence : 0;
    const confPct = Math.round(conf * 100);
    const confBar = `<span class="conf-bar-wrap"><span class="conf-bar" style="width:${confPct}%;background:${confColor(conf)}"></span></span>`;
    const isLast = i === decisions.length - 1;

    // Trigger row
    const trigger = d.trigger
      ? `<div class="tl-trigger">
          <span class="tool-tag">${esc(d.trigger.tool)}</span>
          ${(d.trigger.files??[]).slice(0,4).map(f=>`<span class="file-tag">${esc(f)}</span>`).join('')}
          ${(d.trigger.files??[]).length > 4 ? `<span style="color:#6e7681;font-size:10px">+${d.trigger.files.length-4} more</span>` : ''}
        </div>`
      : '';

    // Signal pills
    const pills = (d.signals??[]).length
      ? `<div class="signal-pills">${(d.signals).map(sig=>`<span class="signal-pill ${esc(sig)}">${esc(sig)}</span>`).join('')}</div>`
      : '';

    // Laya Q&A panel
    const layaPanel = (d.layaDetail && d.layaDetail.length)
      ? renderLayaPanel(d.layaDetail, i)
      : '';

    return `<div class="trail-item">
      <div class="tl-spine">
        <div class="tl-dot ${decCls}"></div>
        ${!isLast ? '<div class="tl-connector"></div>' : ''}
      </div>
      <div class="tl-card ${decCls}">
        <div class="tl-top">
          <span class="tl-decision-badge ${decCls}">${eng === 'override' ? 'OVERRIDE' : esc(dec)}</span>
          <span class="tl-engine-badge">${esc(eng)}</span>
          <span class="tl-reason" style="flex:1;margin:0 8px">${esc(d.reason ?? '')}</span>
          <span class="tl-time">${fmt(d.timestamp)}</span>
        </div>
        <div class="tl-conf">Confidence: <strong>${confPct}%</strong>${confBar}</div>
        ${trigger}
        ${pills}
        ${layaPanel}
      </div>
    </div>`;
  });

  return `
    <div class="section">
      <div class="section-title">Decision Trail (${decisions.length})</div>
      <div class="trail">${items.join('')}</div>
    </div>
  `;
}

function renderLayaPanel(detail, idx) {
  const id = 'laya-' + idx;
  const rows = detail.map(q => {
    const decCls = q.decision === 'BLOCK' ? 'BLOCK' : q.decision === 'WATCH' ? 'WATCH' : 'ALLOW';
    const decColors = {BLOCK:'#f85149',WATCH:'#d29922',ALLOW:'#3fb950'};
    const decBg = {BLOCK:'#3d1f1f',WATCH:'#2d2008',ALLOW:'#1a4030'};
    return `<div class="laya-qa-row">
      <span class="q">${esc(q.question)}</span>
      <span class="choice">${esc(q.choice)}</span>
      <span class="dec" style="background:${decBg[decCls]??'#21262d'};color:${decColors[decCls]??'#8b949e'}">${esc(q.decision)}</span>
    </div>`;
  }).join('');

  return `<div class="laya-panel">
    <div class="laya-panel-head" id="${id}-head" onclick="toggleLaya('${id}')">
      <span class="toggle">▶</span> Laya Q&amp;A Reasoning (${detail.length} question${detail.length!==1?'s':''})
    </div>
    <div class="laya-qa" id="${id}-body">${rows}</div>
  </div>`;
}

function toggleLaya(id) {
  const head = document.getElementById(id + '-head');
  const body = document.getElementById(id + '-body');
  if (!head || !body) return;
  const open = body.classList.toggle('open');
  head.classList.toggle('open', open);
}

// ── Signals ──────────────────────────────────────────────────────────────────

function renderSignals(signals) {
  if (!signals.length) {
    return `<div class="section"><div class="section-title">Signals</div><div class="no-actions">No signals raised.</div></div>`;
  }
  const rows = signals.map(sig => {
    const sev = typeof sig.severity === 'number' ? sig.severity : 0;
    const pct = Math.round(sev * 100);
    const cls = sev >= 0.7 ? 'high' : sev >= 0.4 ? 'med' : 'low';
    const detail = sig.detail
      ? `<span class="signal-detail">${esc(sig.detail)}</span>`
      : '';
    return `<div class="signal-row">
      <span class="signal-type ${esc(sig.type)}">${esc(sig.type)}</span>
      <div class="signal-bar-wrap"><div class="signal-bar ${cls}" style="width:${pct}%"></div></div>
      <span class="signal-sev">${pct}%</span>
      <span style="font-size:11px;color:#6e7681;font-family:monospace">${fmt(sig.timestamp)}</span>
      ${detail}
    </div>`;
  }).join('');

  return `
    <div class="section">
      <div class="section-title">Signals (${signals.length})</div>
      ${rows}
    </div>
  `;
}

// ── Actions log ───────────────────────────────────────────────────────────────

function renderActions(actions) {
  if (!actions.length) {
    return `<div class="section"><div class="section-title">Actions</div><div class="no-actions">No actions recorded.</div></div>`;
  }
  const rows = [...actions].reverse().map(a => `
    <tr>
      <td class="tool-cell">${esc(a.tool)}</td>
      <td class="files-cell">${(a.files??[]).map(f=>`<span>${esc(f)}</span> `).join('')||'—'}</td>
      <td class="time-cell">${fmt(a.timestamp)}</td>
    </tr>
  `).join('');

  return `
    <div class="section">
      <div class="section-title">Actions Log (${actions.length})</div>
      <table class="actions-table">
        <thead><tr><th>Tool</th><th>Files</th><th>Time</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

// ── Failures ──────────────────────────────────────────────────────────────────

function renderFailures(failures) {
  if (!failures.length) return '';
  const rows = failures.map(f => `
    <div class="failure-row">
      <div class="failure-sig">${esc(f.signature)}</div>
      <div style="font-size:12px;color:#6e7681">×${f.count} failures</div>
      <span class="failure-prog ${f.progressing?'yes':'no'}">${f.progressing ? 'progressing' : 'stuck'}</span>
      <div style="font-size:11px;color:#6e7681;font-family:monospace">last: ${fmt(f.lastSeen)}</div>
    </div>
  `).join('');

  return `
    <div class="section">
      <div class="section-title">Failures (${failures.length})</div>
      ${rows}
    </div>
  `;
}

// ── Init ──────────────────────────────────────────────────────────────────────

buildSidebar();
if (SESSIONS.length > 0) selectSession(0);

// Auto-refresh: reload the page every 5 s while a session is active
const hasActive = SESSIONS.some(s => s.status === 'active');
if (hasActive) {
  setTimeout(() => location.reload(), 5000);
}
</script>
